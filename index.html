<script>
const RAW=`@To-infinitive|To-infinitive|to + V nguyên mẫu|To-infinitive là dạng động từ nguyên mẫu có "to" (to + V). Nó không chia theo ngôi hay thì, và có thể làm chủ ngữ, tân ngữ, bổ ngữ hoặc diễn tả mục đích trong câu.
U|I want to learn Japanese.|Tôi muốn học tiếng Nhật. (làm tân ngữ)
U|To learn a language takes time.|Học một ngôn ngữ cần thời gian. (làm chủ ngữ)
U|She went to the market to buy fruit.|Cô ấy ra chợ để mua trái cây. (chỉ mục đích)
S|to + V (khẳng định)|I decided to stay.
S|not to + V (phủ định)|He told me not to be late.
S|to be + V3/V-ed (bị động)|The report needs to be finished today.
S|to have + V3/V-ed (hoàn thành)|She seems to have forgotten.
N|Phủ định đặt "not" trước "to".|She promised not to tell anyone.
N|Sau các động từ khiếm khuyết (can, must, should...) không dùng "to".|I can swim. (không nói: I can to swim.)
N|"in order to" và "so as to" nhấn mạnh mục đích.|He studies hard in order to pass the exam.
A|Nêu mục đích của hành động.|I'm calling to ask about the job.
A|Nói về mong muốn, quyết định.|They decided to move to Da Nang.
A|Làm chủ ngữ để nêu một nhận định chung.|To see is to believe.
X|M|She went to the shop ___ some bread.|buy/to buy/buying|1
X|M|He told me ___ the door.|don't open/not to open/not open|1
X|M|I hope ___ you soon.|see/to see/seeing|1
X|M|It's important ___ on time.|be/to be/being|1
X|F|I want ___ (learn) French.|to learn
X|F|She decided ___ (not / go) to the party.|not to go
X|F|He studies hard ___ (pass) the exam.|to pass/in order to pass/so as to pass
X|T|I can to swim very well.|S
X|T|The report needs to be finished today.|Đ
X|O|She went to the market to buy some fruit
@Bare infinitive|Bare infinitive|V nguyên mẫu không "to"|Bare infinitive là động từ nguyên mẫu không có "to". Nó được dùng sau động từ khiếm khuyết, sau make/let/have + tân ngữ, và sau các động từ chỉ giác quan như see, hear, watch, feel.
U|You must wear a helmet.|Bạn phải đội mũ bảo hiểm. (sau động từ khiếm khuyết)
U|My mother made me clean my room.|Mẹ bắt tôi dọn phòng. (sau make + tân ngữ)
U|I saw him cross the street.|Tôi thấy anh ấy băng qua đường. (sau động từ tri giác)
S|Modal verb + V|She can speak three languages.
S|make/let/have + O + V|The teacher let us leave early.
S|see/hear/watch/feel + O + V (thấy trọn hành động)|I heard her sing.
S|had better / would rather + V|You had better take an umbrella.
N|Câu bị động của make thì phải có "to".|He was made to apologise. (chủ động: They made him apologise.)
N|"help" có thể dùng với hoặc không có "to".|She helped me (to) carry the bags.
N|see + O + V-ing nhấn mạnh hành động đang diễn ra.|I saw him crossing the street.
A|Ra lệnh hoặc bắt buộc ai làm gì.|The boss made them work overtime.
A|Cho phép ai làm gì.|Let me help you.
A|Tả lại điều mình quan sát được.|We watched the sun set.
X|M|She can ___ three languages.|speak/to speak/speaking|0
X|M|My parents let me ___ out late.|to stay/stay/staying|1
X|M|They made him ___ the room.|to clean/clean/cleaning|1
X|M|He was made ___ the room.|clean/to clean/cleaning|1
X|F|You had better ___ (take) an umbrella.|take
X|F|I heard her ___ (sing) in the shower.|sing
X|F|Please let me ___ (help) you.|help
X|T|She made me to wait for an hour.|S
X|T|I saw him cross the road.|Đ
X|O|The teacher let us leave early
@V-ing as noun|V-ing as noun|Danh động từ làm danh từ|Gerund là dạng V-ing đóng vai trò như một danh từ trong câu. Nó có thể làm chủ ngữ, tân ngữ, bổ ngữ, hoặc đứng sau giới từ.
U|Swimming is good for your health.|Bơi lội tốt cho sức khỏe. (làm chủ ngữ)
U|My hobby is reading.|Sở thích của tôi là đọc sách. (làm bổ ngữ)
U|She is interested in learning English.|Cô ấy quan tâm đến việc học tiếng Anh. (sau giới từ)
S|V-ing + V (làm chủ ngữ)|Cooking relaxes me.
S|be + V-ing (làm bổ ngữ)|His job is teaching.
S|Giới từ + V-ing|Thank you for helping me.
S|not + V-ing (phủ định)|Not sleeping enough is harmful.
N|Gerund làm chủ ngữ thì chia động từ số ít.|Smoking is dangerous.
N|Sau giới từ luôn dùng V-ing, không dùng to-V.|I'm afraid of flying.
N|Gerund là danh từ, còn present participle bổ nghĩa như tính từ.|a swimming pool (bể để bơi) và a swimming boy (cậu bé đang bơi)
A|Nói về hoạt động nói chung.|Learning English opens many doors.
A|Nói về sở thích.|My favourite activity is hiking.
A|Dùng trên biển báo, quy định.|No smoking. (Cấm hút thuốc)
X|M|___ is good for your health.|Swim/Swimming/Swam|1
X|M|She is afraid of ___ alone.|go/going/to go|1
X|M|Thank you for ___ me.|help/helping/to help|1
X|M|Smoking ___ bad for health.|are/is/be|1
X|F|He is good at ___ (cook).|cooking
X|F|I look forward to ___ (see) you.|seeing
X|F|___ (not / sleep) enough is bad for you.|not sleeping
X|T|I'm interested in to learn English.|S
X|T|Reading is my favourite hobby.|Đ
X|O|Swimming every day is good for your health
@Verb + gerund|Verb + gerund|Động từ + V-ing|Một số động từ phải được theo sau bởi V-ing, không dùng to-V. Các động từ thường gặp: enjoy, avoid, finish, mind, practise, suggest, consider, keep, admit, deny, risk, miss, postpone, delay, give up.
U|I enjoy listening to music.|Tôi thích nghe nhạc.
U|She finished doing her homework.|Cô ấy đã làm xong bài tập.
U|Would you mind opening the window?|Bạn vui lòng mở cửa sổ được không?
S|enjoy/avoid/finish/mind/practise + V-ing|He avoids eating sweets.
S|suggest/consider/admit/deny + V-ing|She admitted breaking the vase.
S|can't help / can't stand + V-ing|I can't help laughing.
S|give up / keep / go on + V-ing|He keeps talking.
N|Phủ định: thêm not trước V-ing.|He admitted not telling the truth.
N|Có thể thêm tân ngữ hoặc sở hữu cách trước V-ing.|I don't mind him coming late.
N|Một số cụm đi với V-ing: it's worth, it's no use, be busy.|It's worth visiting that museum.
A|Nói về sở thích, thói quen.|She enjoys cycling to work.
A|Đưa ra yêu cầu lịch sự.|Do you mind waiting a moment?
A|Kể về việc đã bỏ hoặc đã hoàn thành.|He gave up smoking last year.
X|M|She enjoys ___ to music.|listen/listening/to listen|1
X|M|He finished ___ his homework.|do/to do/doing|2
X|M|Would you mind ___ the door?|close/closing/to close|1
X|M|They suggested ___ to the beach.|to go/going/go|1
X|F|He avoids ___ (eat) sweets.|eating
X|F|She admitted ___ (break) the vase.|breaking
X|F|It's worth ___ (visit) that museum.|visiting
X|T|I enjoy to swim.|S
X|T|He gave up smoking last year.|Đ
X|O|She enjoys cycling to work every day
@Verb + infinitive|Verb + infinitive|Động từ + to V|Một số động từ được theo sau bởi to-V, hoặc theo sau bởi tân ngữ + to-V. Chúng thường diễn tả mong muốn, quyết định, kế hoạch: want, hope, decide, plan, promise, refuse, agree, manage, afford, expect, learn, offer, tell, ask, advise.
U|They decided to buy a new house.|Họ quyết định mua nhà mới.
U|She refused to answer the question.|Cô ấy từ chối trả lời câu hỏi.
U|My teacher advised me to read more.|Thầy khuyên tôi đọc nhiều hơn.
S|S + V + to V|I hope to visit Japan.
S|S + V + O + to V|She asked him to help her.
S|S + V + not to V (phủ định)|He promised not to be late.
S|S + V + to be V3/V-ed (bị động)|She expects to be promoted.
N|Một số động từ dùng được cả hai cấu trúc: V + to V và V + O + to V.|I want to go. / I want you to go.
N|make và let không dùng "to" sau tân ngữ.|She let me go.
N|manage to V là xoay sở làm được, afford to V là đủ khả năng làm.|He managed to finish. / I can't afford to buy it.
A|Nêu kế hoạch.|We plan to travel in July.
A|Hứa hẹn hoặc từ chối.|He promised to call me.
A|Nhờ vả hoặc khuyên ai đó.|I asked her to turn down the music.
X|M|They decided ___ a new house.|buying/to buy/buy|1
X|M|She refused ___ the question.|answering/to answer/answer|1
X|M|My teacher advised me ___ more.|reading/read/to read|2
X|M|I want you ___ with me.|come/to come/coming|1
X|F|We plan ___ (travel) in July.|to travel
X|F|He managed ___ (finish) the work on time.|to finish
X|F|I can't afford ___ (buy) a new car.|to buy
X|T|She hopes visiting Japan.|S
X|T|He promised to call me.|Đ
X|O|They decided to buy a new house
@Adjective + infinitive|Adjective + infinitive|Tính từ + to V|Nhiều tính từ chỉ cảm xúc, tính chất hay mức độ được theo sau bởi to-V để giải thích rõ hơn về tính từ đó.
U|I'm happy to see you.|Tôi vui khi gặp bạn.
U|This box is too heavy to carry.|Cái hộp này nặng quá không thể xách nổi.
U|It's easy to make mistakes.|Thật dễ mắc lỗi.
S|S + be + adj + to V|I'm glad to meet you.
S|It + be + adj + (for sb) + to V|It's hard for him to understand.
S|S + be + too + adj + to V|He is too tired to work.
S|S + be + adj + enough + to V|She is old enough to drive.
N|Tính từ chỉ cảm xúc (glad, happy, sorry, surprised) đi với to V.|I was surprised to hear the news.
N|too + adj + to V mang nghĩa phủ định, adj + enough + to V mang nghĩa khẳng định.|He's too young to vote. / He's old enough to vote.

  ${sec(3,t.N.map(n=>`<div class="card"><div class="f" data-k="!" style="color:var(--ink);font-size:19px">${n[0]}</div>${ex(n[1])}</div>`).join(''))}
  ${sec(4,t.A.map((a,i)=>`<div class="card"><div class="lab">Tình huống ${i+1}: ${a[0]}</div>${ex(a[1])}</div>`).join(''))}
  ${sec(5,`<div id="exl"></div><div class="res"><span id="sc"></span><button class="btn" id="rs" style="background:var(--bg);color:var(--ink)">Làm lại</button></div>`)}
  <div class="nav2">${k?`<a class="btn gh" href="#${D[k-1].id}">← ${D[k-1].n}</a>`:'<span></span>'}${k<D.length-1?`<a class="btn" href="#${D[k+1].id}">${D[k+1].n} →</a>`:'<span></span>'}</div></main>`;
  const run=()=>{$('exl').innerHTML='';let sc=0,an=0;const N=t.X.length;$('sc').textContent=`Điểm: 0 / ${N}`;
   t.X.forEach((x,i)=>{const el=document.createElement('div');el.className='ex';el.innerHTML=`<h3>Câu ${i+1} · ${{M:'Trắc nghiệm',F:'Điền từ',T:'Đúng / Sai',O:'Sắp xếp câu'}[x[0]]}</h3>`;const box=document.createElement('div');el.appendChild(box);$('exl').appendChild(el);
    R[x[0]](x,box,ok=>{an++;if(ok)sc++;$('sc').textContent=`Điểm: ${sc} / ${N}`+(an===N?' · Hoàn thành! 🎉':'');if(an===N){done[t.id]=sc;save();upd()}})})};
  $('rs').onclick=run;run()}

function route(){const h=location.hash.slice(1);if(/^p\d$/.test(h))return;const k=D.findIndex(t=>t.id===h);k<0?renderHome():renderLesson(k);upd();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
